spring:
  datasource:
    # Docker 环境配置
    # 使用 Docker Compose 中的服务名 'mysql'
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:studyagent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:studyagent}
    password: ${DB_PASSWORD:studyagent2024}
    hikari:
      # 🚀 优化配置 (4核32G服务器)
      maximum-pool-size: 100     # 50 → 100 (支持更高并发)
      minimum-idle: 30           # 20 → 30 (保持更多空闲连接)
      connection-timeout: 30000  # 连接超时30秒
      idle-timeout: 600000       # 空闲连接超时10分钟
      max-lifetime: 1800000      # 连接最大存活时间30分钟
      leak-detection-threshold: 60000  # 连接泄漏检测阈值60秒

  # ========================================
  # RabbitMQ 配置
  # ========================================
  # 使用 Docker Compose 中的服务名 'rabbitmq'
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}


# Python 后端配置（Docker 环境使用服务名）
python-backend:
  url: ${PYTHON_BACKEND_URL:http://backend:8000}
  timeout: 30000

# 前端服务配置（Docker 环境使用服务名）
frontend:
  markdown-service-url: ${FRONTEND_MARKDOWN_SERVICE_URL:http://frontend:3000/api/markdown-to-tiptap}

# 文件存储配置（Docker 环境使用绝对路径）
file:
  storage:
    base-path: ${FILE_STORAGE_PATH:/app/storage}
    upload-path: ${FILE_UPLOAD_PATH:/app/storage/uploads}
    output-path: ${FILE_OUTPUT_PATH:/app/storage/outputs}

# 日志配置
logging:
  level:
    # 完全关闭 MyBatis SQL 日志
    org.mybatis: ERROR
    org.apache.ibatis: ERROR
    com.baomidou.mybatisplus: ERROR
    com.studyagent.infra.mapper: ERROR
    org.springframework.jdbc: ERROR
  file:
    name: /app/logs/studyagent-backend.log

