spring:
  application:
    name: studyagent-backend
  
  # Jackson 配置 - 增加字符串长度限制（用于处理大文件 base64 上传）
  jackson:
    # Spring Boot 3.x 使用 StreamReadConstraints 配置
    # 默认限制是 20MB，这里增加到 100MB
    stream-read-constraints:
      max-string-length: 100000000
  
  datasource:
    # 数据库连接配置
    # 本地环境: localhost:3306 (或 13306 如果使用 Docker MySQL)
    # Docker环境: mysql:3306 (使用服务名)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studyagent}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:studyagent}
    password: ${DB_PASSWORD:studyagent2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      # 🚀 优化配置 (4核32G服务器)
      maximum-pool-size: 100     # 50 → 100 (支持更高并发)
      minimum-idle: 30           # 20 → 30 (保持更多空闲连接)
      connection-timeout: 30000  # 连接超时30秒
      idle-timeout: 600000       # 空闲连接超时10分钟
      max-lifetime: 1800000      # 连接最大存活时间30分钟
      leak-detection-threshold: 60000  # 连接泄漏检测阈值60秒
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      # 🆕 增加文件上传超时时间，避免大文件上传时超时
      # 默认值较小，可能导致大文件上传中断
      file-size-threshold: 0  # 不使用临时文件，直接写入目标位置

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      
server:
  port: 8080
  # 🆕 增加连接超时配置，避免上传过程中连接中断
  tomcat:
    connection-timeout: 300000  # 连接超时 300 秒（5分钟），增加以支持大响应传输
    max-connections: 10000      # 最大连接数
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:400}   # 支撑 Dashboard + SSE 高峰并发
      min-spare: 10             # 最小空闲线程数
    max-http-form-post-size: 104857600  # POST 表单最大大小 100MB (100 * 1024 * 1024)
    max-http-response-header-size: 8KB  # 响应头最大大小
  
  # 🆕 启用响应压缩，减少传输数据量，避免 Broken pipe
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024  # 大于 1KB 的响应才压缩（JSON 响应通常压缩率 60-80%）

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志通过日志级别控制（已设置为 ERROR，如需调试可改为 DEBUG）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.studyagent.infra.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: 1
      logic-not-delete-value: 0

# Clerk 配置
clerk:
  secret-key: ${CLERK_SECRET_KEY:sk_test_xxx}
  publishable-key: ${CLERK_PUBLISHABLE_KEY:pk_test_xxx}
  api-url: ${CLERK_API_URL:https://api.clerk.dev/v1}
  # Clerk Dashboard API keys 页提供的 PEM JWT 公钥。配置后可在本机完成验签，
  # 避免认证请求依赖 Clerk 网络；支持环境变量中的字面量 \n 换行。
  jwt-key: ${CLERK_JWT_KEY:}
  # 允许签发 session token 的前端来源，多个来源使用逗号分隔。
  # 为避免未知现网 azp 导致升级中断，默认不限制；确认真实 azp 后应在生产环境显式配置。
  authorized-parties: ${CLERK_AUTHORIZED_PARTIES:}

# Stripe 配置
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_xxx}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_xxx}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_xxx}
  allow-unsigned-webhooks: ${STRIPE_ALLOW_UNSIGNED_WEBHOOKS:false}
  # 【已废弃】以下 price 配置已不再使用，套餐及 Stripe Price ID 现从 ai_feature_packages 表读取
  # 维护套餐请直接修改数据库，参考 migrations/022、023、025
  price:
    assignment_1: ${STRIPE_PRICE_ASSIGNMENT_1:}
    assignment_5: ${STRIPE_PRICE_ASSIGNMENT_5:}
    assignment_10: ${STRIPE_PRICE_ASSIGNMENT_10:}
    assignment_50: ${STRIPE_PRICE_ASSIGNMENT_50:}
    detection_10k: ${STRIPE_PRICE_DETECTION_10K:}
    detection_50k: ${STRIPE_PRICE_DETECTION_50K:}
    detection_200k: ${STRIPE_PRICE_DETECTION_200K:}
    humanizer_10k: ${STRIPE_PRICE_HUMANIZER_10K:}
    humanizer_50k: ${STRIPE_PRICE_HUMANIZER_50K:}
    humanizer_200k: ${STRIPE_PRICE_HUMANIZER_200K:}
    starter: ${STRIPE_PRICE_STARTER:}
    pro: ${STRIPE_PRICE_PRO:}
    academic: ${STRIPE_PRICE_ACADEMIC:}

# 文件存储配置（默认使用相对于项目根目录的路径）
# 注意：由于启动目录是 agent-start，使用 ../storage 指向项目根目录
file:
  storage:
    base-path: ${FILE_STORAGE_PATH:../storage}
    upload-path: ${FILE_UPLOAD_PATH:../storage/uploads}
    output-path: ${FILE_OUTPUT_PATH:../storage/outputs}
    # 仅当 OSS 已启用且文件已有 oss_key 时，删除超过保留期的本地副本（默认关闭）
    purge-enabled: ${FILE_LOCAL_PURGE_ENABLED:false}
    local-retention-days: ${FILE_LOCAL_RETENTION_DAYS:7}
    purge-cron: ${FILE_LOCAL_PURGE_CRON:0 0 3 * * ?}

# 阿里云 OSS 配置
aliyun:
  oss:
    # 是否启用 OSS 备份（true: 上传文件同时备份到 OSS）
    enabled: ${OSS_ENABLED:true}
    # OSS 访问域名，例如：oss-cn-hangzhou.aliyuncs.com
    # 需要注意服务器上要配置内网 https://help.aliyun.com/zh/oss/user-guide/regions-and-endpoints?spm=a2c4g.11186623.0.0.4a7411a2wEs7cr
    endpoint: ${OSS_ENDPOINT:oss-us-west-1.aliyuncs.com}
    # AccessKey ID（通过环境变量 OSS_ACCESS_KEY_ID 配置，勿提交真实密钥）
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    # AccessKey Secret（通过环境变量 OSS_ACCESS_KEY_SECRET 配置，勿提交真实密钥）
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    # Bucket 名称
    bucket-name: ${OSS_BUCKET_NAME:studyagent}
    # 存储目录前缀（可选，例如：studyagent/uploads）
    path-prefix: ${OSS_PATH_PREFIX:studyagent/uploads}

# 任务提交配置
# quota-enabled: true 使用 AI 额度体系（user_ai_quotas 免费+付费）；false 使用每日次数限制
# daily-limit-per-user: 每日次数上限（仅 quota-enabled=false 时生效），0 或负数表示不限制
task:
  submit:
    quota-enabled: ${TASK_QUOTA_ENABLED:true}
    daily-limit-per-user: ${TASK_DAILY_LIMIT_PER_USER:3}
    # 无 draftId 的新建保存：同用户、同内容指纹在窗口内只落库一次（秒）；0 关闭
    save-draft-idempotency-ttl-seconds: ${TASK_SAVE_DRAFT_IDEM_TTL:60}

# Notify API（message 通道）
# api-token 默认仅本地联调用；生产务必 NOTIFY_API_TOKEN 覆盖，勿提交真实 token
notify:
  enabled: ${NOTIFY_ENABLED:false}
  api-token: ${NOTIFY_API_TOKEN:dev-local-notify-token}
  # 机器人推送等内部调用未传 target 时使用，需与 robot 配置 targets 下的 key 一致
  default-target: ${NOTIFY_DEFAULT_TARGET:default}
  # 内部机器人按业务线路由（值 = robot 配置文件里 targets 的 key）
  robot-target:
    assignment: ${NOTIFY_ROBOT_TARGET_ASSIGNMENT:assignment}
    feedback: ${NOTIFY_ROBOT_TARGET_FEEDBACK:feedback}
    report: ${NOTIFY_ROBOT_TARGET_REPORT:report}
  default-env: ${NOTIFY_DEFAULT_ENV:online}
  robot:
    # 推荐路径：复制仓库 config/robot-webhook-config.example.json 后设置绝对路径。
    config-file: ${NOTIFY_ROBOT_CONFIG_FILE:}
  idempotency:
    enabled: ${NOTIFY_IDEMPOTENCY_ENABLED:true}
    ttl-seconds: ${NOTIFY_IDEMPOTENCY_TTL_SECONDS:600}
  rate-limit:
    enabled: ${NOTIFY_RATE_LIMIT_ENABLED:true}
    per-service-per-minute: ${NOTIFY_RATE_LIMIT_PER_SERVICE_PER_MINUTE:60}

# 数据日报/周报（机器人 Notify，仅统计 DB 可算指标）
# manual-trigger-token 默认仅本地；测试接口 X-Report-Token；生产请 REPORT_TRIGGER_TOKEN 覆盖
report:
  scheduling-enabled: ${REPORT_SCHEDULING_ENABLED:true}
  manual-trigger-token: ${REPORT_TRIGGER_TOKEN:dev-local-report-token}
  title-prefix: ${REPORT_TITLE_PREFIX:Verla 数据}
  # 北京时间；可覆盖默认值
  daily-cron: ${REPORT_DAILY_CRON:0 0 12 * * ?}
  weekly-cron: ${REPORT_WEEKLY_CRON:0 0 12 ? * SUN}

# 前端站点根 URL（用于机器人推送中的任务链接，如 /editor/{taskId}）
app:
  public-site-url: ${PUBLIC_SITE_URL:http://101.251.176.55:13000}

# Humanizer/AI检测 Python 服务配置（独立 Docker 容器，端口 9000）
humanizer-service:
  url: ${HUMANIZER_SERVICE_URL:http://localhost:9000}
  rate-limit:
    detect-stream: 10  # AI 检测 SSE：每分钟最大请求数
    process: 5          # Humanizer 改写：每分钟最大请求数

# Python 后端配置
python-backend:
  url: ${PYTHON_BACKEND_URL:http://localhost:8000}
  timeout: 30000

# RabbitMQ 配置
spring.rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USERNAME:studyagent}
  password: ${RABBITMQ_PASSWORD:studyagent2024}
  virtual-host: ${RABBITMQ_VHOST:/}
  publisher-confirm-type: correlated
  publisher-returns: true

# MQ Outbox 调度配置
mq:
  outbox:
    scan-interval: ${MQ_OUTBOX_SCAN_INTERVAL:5000}
    max-retries: ${MQ_OUTBOX_MAX_RETRIES:5}

# 邮件通知配置（Resend）
notification:
  email:
    enabled: ${EMAIL_NOTIFICATION_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    frontend-url: ${FRONTEND_URL:https://verla.io}
    assignment-completed-template-id: ${EMAIL_ASSIGNMENT_COMPLETED_TEMPLATE_ID:}

# 前端服务配置
frontend:
  # Markdown 转 TipTap JSON 服务 URL
  # 本地环境: http://localhost:3000/api/markdown-to-tiptap
  # Docker 环境: http://frontend:3000/api/markdown-to-tiptap
  markdown-service-url: ${FRONTEND_MARKDOWN_SERVICE_URL:http://localhost:3000/api/markdown-to-tiptap}

# 支付配置
payment:
  success-url: ${PAYMENT_SUCCESS_URL:http://localhost:3000/payment-success}
  cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:3000/payment-canceled}

billing:
  upgrade-pending-cleanup:
    enabled: ${BILLING_UPGRADE_PENDING_CLEANUP_ENABLED:true}
    retention-hours: ${BILLING_UPGRADE_PENDING_CLEANUP_RETENTION_HOURS:24}
    batch-size: ${BILLING_UPGRADE_PENDING_CLEANUP_BATCH_SIZE:100}
    cron: ${BILLING_UPGRADE_PENDING_CLEANUP_CRON:0 25 * * * ?}

# PostHog 分析配置
posthog:
  # 是否启用埋点
  enabled: ${POSTHOG_ENABLED:false}
  # PostHog API Key（从项目设置中获取）
  api-key: ${POSTHOG_API_KEY:}
  # PostHog 服务器地址（默认是官方云，也可以自托管）
  host: ${POSTHOG_HOST:https://us.i.posthog.com}
  # 环境标签（建议: staging / production）
  environment: ${POSTHOG_ENVIRONMENT:}
  # 应用版本标签（建议: v1 / v2）
  app-version: ${POSTHOG_APP_VERSION:}
  # SDK 调试日志（测试环境排查发送失败时开启）
  debug: ${POSTHOG_DEBUG:false}
  # 累积到该数量立即批量发送；其余事件按下面的时间间隔发送
  flush-at: ${POSTHOG_FLUSH_AT:20}
  flush-interval-seconds: ${POSTHOG_FLUSH_INTERVAL_SECONDS:5}

# 日志配置
logging:
  level:
    com.studyagent: DEBUG
    org.springframework: INFO
    # 完全关闭 MyBatis SQL 日志
    org.mybatis: ERROR
    org.apache.ibatis: ERROR
    com.baomidou.mybatisplus: ERROR
    # 关闭 Mapper 接口的 SQL 日志
    com.studyagent.infra.mapper: ERROR
    # 关闭 HikariCP 连接池日志
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.pool.HikariPool: WARN
    # 关闭数据库驱动日志
    com.mysql.cj: WARN
    # 关闭 Spring JDBC 日志
    org.springframework.jdbc: WARN
    org.springframework.jdbc.core: WARN
  pattern:
    # 日志格式包含 traceId、userId，方便链路追踪和问题排查
    # 格式: 时间 [线程] 级别 [traceId] [userId] 日志器 - 消息
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] [%X{userId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] [%X{userId:-}] %logger{36} - %msg%n"
  file:
    name: logs/studyagent-backend.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 浏览器跨域：在默认白名单之外追加 Origin（逗号分隔），例如 https://app.example.com
studyagent:
  cors:
    extra-allowed-origins: ${STUDYAGENT_CORS_EXTRA_ORIGINS:}

# ============================================================
# Verla 链路配置（V2）
# 对应文档 docs/verla-Java侧MVP技术方案.md §16 / §23 / §24
# ============================================================
verla:
  # 1.0 历史作业轻量兼容层（见 docs/02-架构稳定性分析/11-1.0到2.0轻量API兼容方案.md）。
  # enabled=true 时，1.0 已完成 task 实时适配为只读虚拟 conversation 合并进 Dashboard。
  # 默认开启：产品默认兼容展示 1.0 历史作业；如需临时关闭设 VERLA_LEGACY_COMPAT_ENABLED=false
  legacy-compat:
    enabled: ${VERLA_LEGACY_COMPAT_ENABLED:true}
    # 单 artifact body 截断阈值（字节），防大文本撑爆响应
    max-message-bytes: ${VERLA_LEGACY_COMPAT_MAX_MESSAGE_BYTES:65536}
  # 作业 Workforce 主执行（cmd.assignment.run / cmd.agent.control.retry）全局派发并发上限。
  # 0 = 不限制；>0 时超限命令暂留 mq_outbox，待 slot 释放后再发往 Py。
  assignment-run:
    max-concurrency: ${VERLA_ASSIGNMENT_RUN_MAX_CONCURRENCY:4}
  # AI Detection / Humanizer（cmd.detection.run / cmd.humanizer.run）全局派发并发上限。
  # 0 = 不限制；>0 时超限命令暂留 mq_outbox，待 slot 释放后再发往 Py。
  ai-detection-run:
    max-concurrency: ${VERLA_AI_DETECTION_RUN_MAX_CONCURRENCY:10}
  ai-humanizer-run:
    max-concurrency: ${VERLA_AI_HUMANIZER_RUN_MAX_CONCURRENCY:20}
  mq:
    shard-count: 4
    events-exchange: studyagent.events
    command-exchange: studyagent.command
    dlx-exchange: studyagent.dlx
    unroutable-exchange: studyagent.unroutable
  internal:
    # /internal/* 鉴权 token；Py 在 Header X-Verla-Internal-Token 携带
    token: ${VERLA_INTERNAL_TOKEN:dev-internal-token-please-change}
    # POST/PUT 请求 HMAC secret；默认复用 token，需与 Py 的 JAVA_INTERNAL_HMAC_SECRET 对齐
    hmac-secret: ${VERLA_INTERNAL_HMAC_SECRET:${VERLA_INTERNAL_TOKEN:dev-internal-token-please-change}}
    # 允许调用 /internal/* 的客户端 IP CIDR 白名单
    allow-cidrs: ${VERLA_INTERNAL_ALLOW_CIDRS:127.0.0.1/32,172.16.0.0/12,10.0.0.0/8}
    # GET 请求是否跳过 HMAC 校验（POST/PUT 强制校验）
    skip-hmac-on-get: true
    # 生产务必 VERLA_INTERNAL_MOCK_DATA=false
    mock-data: ${VERLA_INTERNAL_MOCK_DATA:false}

  context-cache:
    # 生产设 VERLA_CONTEXT_CACHE_REDIS_ENABLED=true 并配置 spring.data.redis
    redis-enabled: ${VERLA_CONTEXT_CACHE_REDIS_ENABLED:false}
    key-prefix: verla:v1
    conv-summary-ttl: 10m
    messages-recent-ttl: 10m
    messages-history-ttl: 30m
    turn-meta-ttl: 30s
    sess-meta-ttl: 30s
    session-running-ttl: 30s
    session-terminal-ttl: 10m
    upstream-sessions-ttl: 30s
    block-responses-ttl: 120s
    negative-ttl: 20s
    jitter-ratio: 0.15
    redis-lock-timeout: 3s
    redis-lock-retry-delay: 30ms
    redis-lock-retry-max-attempts: 2
    redis-circuit-failure-threshold: 3
    redis-circuit-open-duration: 5s
  sse:
    # SseEmitter 绝对超时（毫秒）；0=不超时。生产可设 1800000（30min）作兜底。
    emitter-timeout-ms: ${VERLA_SSE_EMITTER_TIMEOUT_MS:0}
    heartbeat-interval-ms: ${VERLA_SSE_HEARTBEAT_INTERVAL_MS:15000}
    # 无业务 verla 事件超过该时长则服务端主动断开；0=关闭 idle 清扫。
    idle-timeout-ms: ${VERLA_SSE_IDLE_TIMEOUT_MS:600000}
    idle-sweep-interval-ms: ${VERLA_SSE_IDLE_SWEEP_INTERVAL_MS:60000}
    max-emitters-per-conversation: ${VERLA_SSE_MAX_EMITTERS_PER_CONV:8}
    # 单用户全局 SSE 上限；0=不限制。HTTP/1.1 多 Tab 场景建议 12~20。
    max-emitters-per-user: ${VERLA_SSE_MAX_EMITTERS_PER_USER:16}
  watchdog:
    turn-timeout-seconds: 120
    session-progress-timeout-seconds: 60
  attachment:
    max-bytes: ${VERLA_ATTACHMENT_MAX_BYTES:33554432}
    sign-ttl-seconds: ${VERLA_ATTACHMENT_SIGN_TTL_SECONDS:3600}
    allowed-mimes: ${VERLA_ATTACHMENT_ALLOWED_MIMES:application/pdf,image/png,image/jpeg,image/webp,text/plain,text/markdown,text/html,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel}
    oss-key-prefix: ${VERLA_ATTACHMENT_OSS_KEY_PREFIX:verla/v2/attachments}
  editor:
    pdf-export:
      max-concurrent: ${VERLA_EDITOR_PDF_EXPORT_MAX_CONCURRENT:2}
      max-content-json-bytes: ${VERLA_EDITOR_PDF_EXPORT_MAX_CONTENT_JSON_BYTES:10485760}
      # Next.js PDF 渲染服务地址（Tiptap JSON → HTML → Gotenberg → PDF）
      # 本地开发: http://127.0.0.1:3001
      # 线上部署: http://frontend-v2:3001（docker compose 服务名）
      conversion-base-url: ${VERLA_EDITOR_PDF_CONVERSION_BASE_URL:}
  # V2 verla 链路商业化额度
  # 日常 VIP 请写 DB 表 quota_vip_users（改 SQL 约 30s 内生效，无需重启）
  # whitelist-user-ids 仅作紧急 env 兜底
  quota:
    enabled: ${VERLA_QUOTA_ENABLED:true}
    whitelist-user-ids: ${VERLA_QUOTA_WHITELIST_USER_IDS:}

# ============================================================
# 1.0 Humanizer 任务 Worker 配置
# ============================================================
humanizer:
  whitelist-user-ids: ${HUMANIZER_WHITELIST_USER_IDS:}
  detect-concurrency: ${HUMANIZER_DETECT_CONCURRENCY:2}
  humanize-concurrency: ${HUMANIZER_HUMANIZE_CONCURRENCY:3}
